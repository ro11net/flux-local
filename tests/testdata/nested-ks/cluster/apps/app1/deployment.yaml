apiVersion: v1
kind: Namespace
metadata:
  name: app1
  labels:
    environment: ${ENVIRONMENT}
    region: ${REGION}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
        environment: ${ENVIRONMENT}
    spec:
      containers:
      - name: app1
        image: ${REGISTRY}/app1:latest
        env:
        - name: ENVIRONMENT
          value: ${ENVIRONMENT}
        - name: REGION
          value: ${REGION}
