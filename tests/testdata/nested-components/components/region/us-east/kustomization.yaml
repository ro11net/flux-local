apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: Deployment
    name: backend
  patch: |-
    - op: add
      path: /metadata/labels/region
      value: us-east-1
    - op: add
      path: /spec/template/metadata/labels/region
      value: us-east-1
- target:
    kind: Namespace
    name: backend
  patch: |-
    - op: add
      path: /metadata/labels/region
      value: us-east-1
