apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: Deployment
    name: backend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: add
      path: /metadata/labels
      value:
        flavor: production
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: backend:v2.0.0
- target:
    kind: Deployment
    name: backend
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/flavor
      value: production
