apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
  labels:
    environment: ${ENVIRONMENT}
spec:
  interval: 10m
  path: ./tests/testdata/nested-components/cluster/apps
  # Components with variables - Level 1
  components:
    - ../../components/flavor/${ENVIRONMENT}
  sourceRef:
    kind: GitRepository
    name: flux-system
