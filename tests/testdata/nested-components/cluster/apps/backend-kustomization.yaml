apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backend
  namespace: flux-system
  labels:
    environment: ${ENVIRONMENT}
    region: ${REGION}
spec:
  interval: 10m
  path: ./tests/testdata/nested-components/cluster/apps/backend
  # NESTED components with variables - Level 2
  components:
    - ../../../components/flavor/${ENVIRONMENT}
    - ../../../components/region/${REGION}
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: apps
