apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend:latest
        env:
        - name: ENVIRONMENT
          value: ${ENVIRONMENT}
        - name: REGION
          value: ${REGION}
