apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: podinfo
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: podinfo
      version: ${CHART_VERSION}
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  values:
    replicaCount: 2
    ingress:
      enabled: true
      className: ${INGRESS_CLASS}
      hosts:
        - host: podinfo.${DOMAIN}
          paths:
            - path: /
              pathType: Prefix
    image:
      registry: ${REGISTRY}
      repository: podinfo
      tag: ${CHART_VERSION}
    metadata:
      annotations:
        environment: ${ENVIRONMENT}
